services:
  postgres:
    image: postgres:16-alpine
    container_name: mealcard_postgres
    environment:
      POSTGRES_USER: mealcard
      POSTGRES_PASSWORD: mealcard
      POSTGRES_DB: mealcard
    ports:
      - "5432:5432"
    volumes:
      - mealcard_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: mealcard_redis
    ports:
      - "6379:6379"
volumes:
  mealcard_pg:
